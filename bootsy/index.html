    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #fff;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery a {
            display: block;
            position: relative;
            overflow: hidden;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            transition: transform 0.2s;
        }
        .gallery a:hover img {
            transform: scale(1.05);
        }
        .gallery .play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 40px;
            text-shadow: 0 0 10px rgba(0,0,0,0.7);
            pointer-events: none;
        }
    </style>
